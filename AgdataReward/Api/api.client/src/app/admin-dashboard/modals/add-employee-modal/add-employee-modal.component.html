<div *ngIf="isOpen" class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Add Employee</h3>
      <button class="modal-close" (click)="onClose()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Employee ID *</label>
        <input
          type="text"
          [(ngModel)]="formData.employeeId"
          placeholder="e.g., EMP001"
        />
      </div>
      <div class="form-group">
        <label>Name *</label>
        <input
          type="text"
          [(ngModel)]="formData.name"
          placeholder="Enter employee name"
        />
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input
          type="email"
          [(ngModel)]="formData.email"
          placeholder="employee@agdata.com"
        />
      </div>
      <div class="form-group">
        <label>Initial Points</label>
        <input
          type="number"
          [(ngModel)]="formData.points"
          placeholder="0"
          min="0"
        />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" (click)="onClose()">Cancel</button>
      <button class="btn-save" (click)="onSave()">Add Employee</button>
    </div>
  </div>
</div>

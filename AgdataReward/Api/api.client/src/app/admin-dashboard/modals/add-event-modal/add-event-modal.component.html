<div *ngIf="isOpen" class="modal-overlay" (click)="onClose()">
  <div class="modal-content large" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Add Event</h3>
      <button class="modal-close" (click)="onClose()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Code *</label>
          <input
            type="text"
            [(ngModel)]="formData.eventId"
            placeholder="e.g., EVT001"
          />
        </div>
        <div class="form-group">
          <label>Event Name *</label>
          <input
            type="text"
            [(ngModel)]="formData.name"
            placeholder="Enter event name"
          />
        </div>
      </div>
      <div class="form-group">
        <label>Description *</label>
        <textarea
          [(ngModel)]="formData.description"
          rows="3"
          placeholder="Enter event description"
        ></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>1st Prize Points *</label>
          <input
            type="number"
            [(ngModel)]="formData.firstPrize"
            placeholder="0"
            min="0"
          />
        </div>
        <div class="form-group">
          <label>2nd Prize Points *</label>
          <input
            type="number"
            [(ngModel)]="formData.secondPrize"
            placeholder="0"
            min="0"
          />
        </div>
        <div class="form-group">
          <label>3rd Prize Points *</label>
          <input
            type="number"
            [(ngModel)]="formData.thirdPrize"
            placeholder="0"
            min="0"
          />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Start Date *</label>
          <input type="date" [(ngModel)]="formData.startDate" />
        </div>
        <div class="form-group">
          <label>End Date *</label>
          <input type="date" [(ngModel)]="formData.endDate" />
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" (click)="onClose()">Cancel</button>
      <button class="btn-save" (click)="onSave()">Add Event</button>
    </div>
  </div>
</div>

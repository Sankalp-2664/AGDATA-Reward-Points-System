

<div *ngIf="isOpen" class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Add Product</h3>
      <button class="modal-close" (click)="onClose()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Product ID *</label>
        <input
          type="text"
          [(ngModel)]="formData.productId"
          placeholder="e.g., PROD001"
        />
      </div>
      <div class="form-group">
        <label>Product Name *</label>
        <input
          type="text"
          [(ngModel)]="formData.name"
          placeholder="Enter product name"
        />
      </div>
      <div class="form-group">
        <label>Stock Quantity *</label>
        <input
          type="number"
          [(ngModel)]="formData.stock"
          placeholder="0"
          min="0"
        />
      </div>
      <div class="form-group">
        <label>Points Required *</label>
        <input
          type="number"
          [(ngModel)]="formData.points"
          placeholder="0"
          min="0"
        />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" (click)="onClose()">Cancel</button>
      <button class="btn-save" (click)="onSave()">Add Product</button>
    </div>
  </div>
</div>

<div class="home-container">
  <div class="home-header">
    <h1 class="home-title">Welcome to AGDATA Reward System</h1>
    <p class="home-subtitle">Your dashboard - coming soon!</p>
  </div>

  <div class="home-content">
    <div class="quick-actions">
      <h2>Quick Actions</h2>
      <div class="action-grid">
        <div class="action-card" (click)="navigateToEvents()">
          <div class="action-icon">🎯</div>
          <h3>Events</h3>
          <p>Participate in events and earn rewards</p>
        </div>
        <div class="action-card" (click)="navigateToProducts()">
          <div class="action-icon">🎁</div>
          <h3>Products</h3>
          <p>Redeem your points for amazing products</p>
        </div>
        <div class="action-card" (click)="navigateToRewards()">
          <div class="action-icon">🏆</div>
          <h3>My Rewards</h3>
          <p>View your redemption history</p>
        </div>
      </div>
    </div>
  </div>
</div>

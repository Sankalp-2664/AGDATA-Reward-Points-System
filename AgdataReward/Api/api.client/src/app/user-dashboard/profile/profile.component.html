<div class="profile-shell">
  <!-- Main Content -->
  <main class="content">
    <div class="page-header">
      <h1>My Profile</h1>
      <p class="subtitle">View your employee information</p>
    </div>

    <!-- Profile Card -->
    <section class="profile-card">
      <!-- Profile Header -->
      <div class="profile-header">
        <div class="profile-avatar">
          <div class="avatar-icon">👤</div>
        </div>
        <div class="profile-info">
          <h2 class="profile-name">{{ currentUser?.firstName }} {{ currentUser?.lastName }}</h2>
          <p class="profile-id"># {{ currentUser?.employeeId }}</p>
        </div>
        <div class="profile-status">
          <span class="status-badge active">
            <span class="status-icon">✓</span> {{ currentUser?.status }}
          </span>
        </div>
      </div>

      <!-- Profile Form -->
      <div class="profile-form">
        <div class="form-row">
          <div class="form-group">
            <label>Employee ID</label>
            <div class="input-with-icon">
              <span class="input-icon">#</span>
              <input
                type="text"
                [value]="currentUser?.employeeId"
                disabled
              />
            </div>
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <div class="input-with-icon">
              <span class="input-icon">✉</span>
              <input
                type="email"
                [(ngModel)]="formData.email"
                [disabled]="!isEditing"
              />
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <div class="input-with-icon">
              <span class="input-icon">👤</span>
              <input
                type="text"
                [(ngModel)]="formData.firstName"
                [disabled]="!isEditing"
              />
            </div>
          </div>

          <div class="form-group">
            <label>Last Name</label>
            <div class="input-with-icon">
              <span class="input-icon">👤</span>
              <input
                type="text"
                [(ngModel)]="formData.lastName"
                [disabled]="!isEditing"
              />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Account Status</label>
          <div class="input-with-icon">
            <span class="input-icon">✓</span>
            <input
              type="text"
              [value]="currentUser?.status"
              disabled
            />
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="profile-actions">
        <button
          *ngIf="!isEditing"
          class="btn-update"
          (click)="toggleEdit()"
        >
          ✎ Update Profile
        </button>

        <div *ngIf="isEditing" class="edit-actions">
          <button class="btn-cancel" (click)="toggleEdit()">
            Cancel
          </button>
          <button class="btn-save" (click)="saveProfile()">
            💾 Save Changes
          </button>
        </div>

        <button class="btn-logout" (click)="logout()">
          🚪 Logout
        </button>
      </div>
    </section>
  </main>
</div>
